name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write
  id-token: write

jobs:
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@v4
      - if: steps.dependency-review.outcome == 'failure'
        run: |
          echo "::warning::Dependency review is unavailable or failed. Enable GitHub Dependency Graph for blocking dependency-review enforcement. pnpm audit remains blocking."

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  scorecard:
    name: openssf scorecard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_format: sarif
          results_file: scorecard-results.sarif
          publish_results: true
      - if: steps.scorecard.outcome == 'failure'
        run: |
          echo "::warning::OpenSSF Scorecard failed or reported advisory findings. Audit and CodeQL remain blocking; review the scorecard job output before release."

  required:
    name: security / required
    runs-on: ubuntu-latest
    needs: [dependency-review, audit, codeql, scorecard]
    if: always()
    steps:
      - run: |
          for result in "${{ needs.audit.result }}" "${{ needs.codeql.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "Security job failed or was cancelled."
              exit 1
            fi
          done

          for result in "${{ needs.dependency-review.result }}" "${{ needs.scorecard.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::warning::Advisory security job failed or was cancelled."
            fi
          done
